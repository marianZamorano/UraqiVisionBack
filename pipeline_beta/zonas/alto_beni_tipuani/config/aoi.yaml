# Zona de análisis del MVP (decisión DP-08: puede cambiar; todo script la lee de aquí).
nombre: AltoBeniTipuani
descripcion: "Tipuani y Alto Beni, La Paz (aprox.): referencia de agua en epoca seca para inundaciones"
crs: EPSG:4326
caja:            # lon/lat
  oeste: -68.24
  sur: -15.79
  este: -67.77
  norte: -15.32

periodo:
  inicio: "2026-06-17"       # primer dato NISAR
  fin: "2026-12-31"          # solo 2026
  hueco:                     # hueco permanente sin datos NISAR
    inicio: "2026-07-27"
    fin: "2026-08-10"

bolivia:         # caja aproximada del país (FIRMS y huellas)
  oeste: -69.7
  sur: -22.9
  este: -57.4
  norte: -9.6

nisar:
  colecciones:
    provisional: NISAR_L2_GCOV_PROVISIONAL_V1   # 17 jun – 23 oct 2026, serie principal
    validated: NISAR_L2_GCOV_V1                 # desde 21 oct 2026, tramo APARTE
  grupo: /science/LSAR/GCOV/grids/frequencyA
  capas: [HHHH, HVHV, mask, numberOfLooks]
  polarizacion: DHDH

sentinel2:
  stac: https://earth-search.aws.element84.com/v1
  coleccion: sentinel-2-l2a
  assets: [nir08, swir22, scl]
  ventanas:
    antes: ["2026-06-17", "2026-07-26"]
    despues: ["2026-09-15", "2026-10-23"]
    # VC-01: par óptico que encierra el periodo de detección de la órbita 118A
    antes_radar: ["2026-07-08", "2026-07-24"]
    despues_radar: ["2026-09-25", "2026-11-12"]   # ampliada: los Yungas están casi siempre nublados en octubre

firms:
  inicio: "2026-06-17"
  dias_por_pedido: 5
  sensores: [VIIRS_SNPP, VIIRS_NOAA20, MODIS]

limite_gb: 5      # si data/ fuera a pasar de esto, los scripts se detienen

estacion:        # textos de la estación publicada (08_publicar_borrador.py)
  id: alto-beni
  departamento: La Paz
  nombre: {es: "Alto Beni y Tipuani", en: "Alto Beni and Tipuani"}
  criterio:
    es: "Caja de ~50 km en Alto Beni y Tipuani (La Paz) con 812 focos FIRMS desde el 11 ago 2026; órbita 118A con 3 fechas sanas antes del hueco (cumple MC-02). Relieve de Yungas: sombras e inversiones del radar en laderas"
    en: "~50 km box in Alto Beni and Tipuani (La Paz) with 812 FIRMS hotspots since 11 Aug 2026; orbit 118A with 3 sound dates before the gap (meets MC-02). Yungas relief: radar shadow and layover on slopes"
