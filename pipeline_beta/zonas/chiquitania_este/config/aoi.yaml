# Zona de análisis del MVP (decisión DP-08: puede cambiar; todo script la lee de aquí).
nombre: ChiquitaniaEste
descripcion: Chiquitanía, celda con más focos FIRMS desde el 11 ago 2026 (propuesta para DP-08), Santa Cruz, Bolivia
crs: EPSG:4326
caja:            # lon/lat
  oeste: -59.69
  sur: -17.86
  este: -59.22
  norte: -17.39

periodo:
  inicio: "2026-06-17"       # primer dato NISAR
  fin: "2026-12-31"          # solo 2026
  hueco:                     # hueco permanente sin datos NISAR
    inicio: "2026-07-27"
    fin: "2026-08-10"

bolivia:         # caja aproximada del país (FIRMS y huellas)
  oeste: -69.7
  sur: -22.9
  este: -57.4
  norte: -9.6

nisar:
  colecciones:
    provisional: NISAR_L2_GCOV_PROVISIONAL_V1   # 17 jun – 23 oct 2026, serie principal
    validated: NISAR_L2_GCOV_V1                 # desde 21 oct 2026, tramo APARTE
  grupo: /science/LSAR/GCOV/grids/frequencyA
  capas: [HHHH, HVHV, mask, numberOfLooks]
  polarizacion: DHDH

sentinel2:
  stac: https://earth-search.aws.element84.com/v1
  coleccion: sentinel-2-l2a
  assets: [nir08, swir22, scl]
  ventanas:
    antes: ["2026-06-17", "2026-07-26"]
    despues: ["2026-09-15", "2026-10-23"]
    # VC-01: pares ópticos que encierran el periodo de detección del radar (29 ago → 16 oct)
    antes_radar: ["2026-08-18", "2026-09-04"]
    despues_radar: ["2026-10-10", "2026-10-28"]

firms:
  inicio: "2026-06-17"
  dias_por_pedido: 5
  sensores: [VIIRS_SNPP, VIIRS_NOAA20, MODIS]

limite_gb: 5      # si data/ fuera a pasar de esto, los scripts se detienen

estacion:        # textos de la estación publicada (08_publicar_borrador.py)
  nombre: {es: "Chiquitanía este", en: "Eastern Chiquitanía"}
  criterio:
    es: "Celda de ~50 km con más focos FIRMS desde el 11 ago 2026 (evaluada para DP-08; se eligió otra caja más cerca de San Ignacio)"
    en: "~50 km cell with the most FIRMS hotspots since 11 Aug 2026 (evaluated for DP-08; a box closer to San Ignacio was chosen)"
