# Zona de análisis del MVP (decisión DP-08: puede cambiar; todo script la lee de aquí).
nombre: BeniNorte
descripcion: "Norte del Beni: celda con 2096 focos desde el 11 ago 2026; prueba de la orbita 089A"
crs: EPSG:4326
caja:            # lon/lat
  oeste: -65.80
  sur: -12.22
  este: -65.33
  norte: -11.75

periodo:
  inicio: "2026-06-17"       # primer dato NISAR
  fin: "2026-12-31"          # solo 2026
  hueco:                     # hueco permanente sin datos NISAR
    inicio: "2026-07-27"
    fin: "2026-08-10"

bolivia:         # caja aproximada del país (FIRMS y huellas)
  oeste: -69.7
  sur: -22.9
  este: -57.4
  norte: -9.6

nisar:
  colecciones:
    provisional: NISAR_L2_GCOV_PROVISIONAL_V1   # 17 jun – 23 oct 2026, serie principal
    validated: NISAR_L2_GCOV_V1                 # desde 21 oct 2026, tramo APARTE
  grupo: /science/LSAR/GCOV/grids/frequencyA
  capas: [HHHH, HVHV, mask, numberOfLooks]
  polarizacion: DHDH

sentinel2:
  stac: https://earth-search.aws.element84.com/v1
  coleccion: sentinel-2-l2a
  assets: [nir08, swir22, scl]
  ventanas:
    antes: ["2026-06-17", "2026-07-26"]
    despues: ["2026-09-15", "2026-10-23"]
    # VC-01: par óptico que encierra el periodo de detección de esta órbita
    antes_radar: ["2026-07-15", "2026-07-31"]
    despues_radar: ["2026-10-15", "2026-10-31"]

firms:
  inicio: "2026-06-17"
  dias_por_pedido: 5
  sensores: [VIIRS_SNPP, VIIRS_NOAA20, MODIS]

limite_gb: 5      # si data/ fuera a pasar de esto, los scripts se detienen

estacion:        # textos de la estación publicada (08_publicar_borrador.py)
  id: beni-norte
  departamento: Beni
  nombre: {es: "Beni norte", en: "Northern Beni"}
  criterio:
    es: "Celda de ~50 km con 2.096 focos FIRMS desde el 11 ago 2026; órbita 089A con 4 fechas sanas antes del hueco (cumple MC-02)"
    en: "~50 km cell with 2,096 FIRMS hotspots since 11 Aug 2026; orbit 089A with 4 sound dates before the gap (meets MC-02)"
